# ============================================================
# SURGE-AI Trading - Full Docker Compose Stack
# Complete deployment with all services
# ============================================================
#
# Services:
#   - timescaledb: Time-series database for OHLCV data
#   - milvus: Vector database for pattern matching
#   - redis: Cache and message queue
#   - minio: Object storage for Milvus
#   - etcd: Milvus metadata storage
#   - backend: FastAPI backend server
#   - frontend: Next.js dashboard
#   - ml-scheduler: Automated signal generation
#   - attu: Milvus web UI (optional)
#   - pgadmin: PostgreSQL web UI (optional)
#
# Usage:
#   docker-compose -f docker-compose.full.yml up -d
#   docker-compose -f docker-compose.full.yml logs -f
#   docker-compose -f docker-compose.full.yml down
#
# ============================================================

services:
  # ============================================================
  # DATABASES
  # ============================================================

  # TimescaleDB - Time-Series Database for OHLCV and Features
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: surge-timescaledb
    restart: unless-stopped
    ports:
      - "${TIMESCALE_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surge_secret_2024}
      POSTGRES_DB: ${POSTGRES_DB:-surge_trading}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./tools/data_downloader/docker/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-surge_trading}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - surge-network

  # etcd - Milvus Metadata Storage
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: surge-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - surge-network

  # MinIO - Object Storage for Milvus
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: surge-minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - surge-network

  # Milvus - Vector Database for Pattern Matching
  milvus:
    image: milvusdb/milvus:v2.3.3
    container_name: surge-milvus
    restart: unless-stopped
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_GRPC_PORT:-9091}:9091"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - milvus_data:/var/lib/milvus
    command: ["milvus", "run", "standalone"]
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - surge-network

  # Redis - Cache and Message Queue
  redis:
    image: redis:7-alpine
    container_name: surge-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - surge-network

  # ============================================================
  # APPLICATION SERVICES
  # ============================================================

  # Backend - FastAPI Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: surge-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DEBUG=${DEBUG:-false}
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
      - BINANCE_TESTNET=${BINANCE_TESTNET:-true}
      - TRADING_SYMBOL=${TRADING_SYMBOL:-BTCUSDT}
      - TRADING_ENABLED=${TRADING_ENABLED:-false}
      - MAX_POSITION_SIZE_PERCENT=${MAX_POSITION_SIZE_PERCENT:-12.5}
      - MAX_TOTAL_EXPOSURE_PERCENT=${MAX_TOTAL_EXPOSURE_PERCENT:-50.0}
      - MAX_DRAWDOWN_PERCENT=${MAX_DRAWDOWN_PERCENT:-15.0}
      - DAILY_LOSS_LIMIT_PERCENT=${DAILY_LOSS_LIMIT_PERCENT:-3.0}
      - MIN_CONFIDENCE_THRESHOLD=${MIN_CONFIDENCE_THRESHOLD:-70.0}
      - REDIS_URL=redis://redis:6379
      - TIMESCALE_HOST=timescaledb
      - TIMESCALE_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-surge_trading}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-surge_secret_2024}
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - surge-network

  # Frontend - Next.js Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: surge-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - surge-network

  # ML Scheduler - Automated Signal Generation
  ml-scheduler:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: surge-ml-scheduler
    restart: unless-stopped
    environment:
      - TIMESCALE_HOST=timescaledb
      - TIMESCALE_PORT=5432
      - POSTGRES_HOST=timescaledb
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-surge_trading}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-surge_secret_2024}
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TRADING_SYMBOL=${TRADING_SYMBOL:-BTCUSDT}
      - SIGNAL_THRESHOLD=${SIGNAL_THRESHOLD:-0.55}
    volumes:
      - ml_models:/app/models
      - ml_outputs:/app/outputs
      - ml_cache:/app/cache
    depends_on:
      timescaledb:
        condition: service_healthy
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - surge-network

  # ============================================================
  # ADMIN TOOLS (Optional - Comment out if not needed)
  # ============================================================

  # Attu - Milvus Web UI
  attu:
    image: zilliz/attu:v2.3.2
    container_name: surge-attu
    restart: unless-stopped
    ports:
      - "${ATTU_PORT:-8080}:3000"
    environment:
      MILVUS_URL: milvus:19530
    depends_on:
      - milvus
    profiles:
      - admin
    networks:
      - surge-network

  # pgAdmin - PostgreSQL Web UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: surge-pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-8081}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@suriota.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - timescaledb
    profiles:
      - admin
    networks:
      - surge-network

  # Nginx - Reverse Proxy (Alternative deployment)
  nginx:
    image: nginx:alpine
    container_name: surge-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    profiles:
      - nginx
    networks:
      - surge-network

# ============================================================
# NETWORKS
# ============================================================
networks:
  surge-network:
    name: surge-ai-network
    external: true

# ============================================================
# VOLUMES
# ============================================================
volumes:
  timescaledb_data:
    name: surge-timescaledb-data
    external: true
  etcd_data:
    name: surge-etcd-data
    external: true
  minio_data:
    name: surge-minio-data
    external: true
  milvus_data:
    name: surge-milvus-data
    external: true
  redis_data:
    name: surge-redis-data
    external: true
  ml_models:
    name: surge-ml-models
  ml_outputs:
    name: surge-ml-outputs
  ml_cache:
    name: surge-ml-cache
  pgadmin_data:
    name: surge-pgadmin-data
